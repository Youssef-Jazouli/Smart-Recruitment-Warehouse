services:
  # 1. MinIO (Data Lake)
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  # 2. PostgreSQL (Data Warehouse)
  postgres:
    image: postgres:15
    container_name: postgres_dwh
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # 3. Pipeline (Scraper + Cleaning + Gold Load)
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pipeline_runner
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - MINIO_ENDPOINT=http://minio:9000
    volumes:
      - ../bronze_data:/app/bronze_data
      - ../silver_data:/app/silver_data
    command: >
      sh -c "
      python src/upload_bronze_to_minio.py &&
      python src/data_cleaning_silver.py &&
      python src/database_load_gold.py
      "
volumes:
  minio_data:
  postgres_data: